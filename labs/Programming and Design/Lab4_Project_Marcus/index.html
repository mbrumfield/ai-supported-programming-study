<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 4 - Course Average Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Course Average Calculator</h1>

        <div class="form-group">
            <label for="course">Course</label>
            <select id="course">
                <option value="">Select a Course</option>
                <option value="CSC 221 - Fundamental Programming I">
                    CSC 221 - Fundamental Programming I
                </option>
                <option value="MAT 131 - College Algebra">
                    MAT 131 - College Algebra
                </option>
                <option value="BIO 111 - General Biology">
                    BIO 111 - General Biology
                </option>
            </select>
            <span id="courseError" class="error"></span>
        </div>

        <div id="scores">
            <div class="form-group">
                <label>Score 1</label>
                <input type="number" id="score1" min="0" max="100">
                <span class="error"></span>
            </div>

            <div class="form-group">
                <label>Score 2</label>
                <input type="number" id="score2" min="0" max="100">
                <span class="error"></span>
            </div>

            <div class="form-group">
                <label>Score 3</label>
                <input type="number" id="score3" min="0" max="100">
                <span class="error"></span>
            </div>

            <div class="form-group">
                <label>Score 4</label>
                <input type="number" id="score4" min="0" max="100">
                <span class="error"></span>
            </div>

            <div class="form-group">
                <label>Score 5</label>
                <input type="number" id="score5" min="0" max="100">
                <span class="error"></span>
            </div>
        </div>

        <div class="button-row">
            <button id="calculateBtn">Calculate Average</button>
            <button id="resetBtn">Reset</button>
            <button id="saveBtn">Save To CSV</button>
        </div>

        <div id="results">
            <h2>Results</h2>

            <p><strong>Course:</strong> <span id="displayCourse">-</span></p>
            <p><strong>Average:</strong> <span id="displayAverage">-</span></p>
            <p><strong>Letter Grade:</strong> <span id="displayGrade">-</span></p>
        </div>
    </div>

    <script src="main.js"></script>

</body>
</html>
